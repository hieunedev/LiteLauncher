name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package source
        run: |
          zip -qr LiteLauncher-source.zip             app build.gradle.kts settings.gradle.kts gradle.properties             AndroidManifest.xml 2>/dev/null || true
          if [ -d app ]; then
            zip -qr LiteLauncher-source.zip app build.gradle.kts settings.gradle.kts gradle.properties
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-source
          path: LiteLauncher-source.zip
