name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract project
        run: unzip -q LiteLauncher.zip

      - name: Apply Kotlin compatibility fixes
        working-directory: LiteLauncher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, transform):
              p = Path(path)
              lines = p.read_text().splitlines()
              out = transform(lines)
              if out == lines:
                  raise SystemExit(f"{path}: no changes were made")
              p.write_text("\n".join(out) + "\n")

          def control(lines):
              out = []
              i = 0
              changed = False
              while i < len(lines):
                  if "val id = cam ?: cm.cameraIdList.firstOrNull" in lines[i]:
                      out.extend([
                          "        val id = cam ?: cm.cameraIdList.firstOrNull { cameraId ->",
                          "            cm.getCameraCharacteristics(cameraId).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true",
                          "        } ?: return",
                          "        cam = id",
                          "        torchOn = !torchOn",
                          "        cm.setTorchMode(id, torchOn)"
                      ])
                      i += 2
                      changed = True
                  else:
                      out.append(lines[i])
                      i += 1
              return out if changed else lines

          def island(lines):
              out = []
              changed = False
              for line in lines:
                  if "if (n.category !in live" in line:
                      out.extend([
                          "            val category = n.category",
                          "            if (category == null || category !in live || (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return@post"
                      ])
                      changed = True
                  else:
                      out.append(line)
              return out if changed else lines

          def main(lines):
              out = []
              changed = False
              for line in lines:
                  if "private fun pageAdapter(count:" in line:
                      out.append("    private fun pageAdapter(count: () -> Int, bind: (Int) -> View): RecyclerView.Adapter<RecyclerView.ViewHolder> = object : RecyclerView.Adapter<RecyclerView.ViewHolder>() {")
                      changed = True
                  elif "gravity = if (st.clockCenter) Gravity.CENTER else Gravity.CENTER_VERTICAL or Gravity.START" in line:
                      out.append("        gravity = if (st.clockCenter) Gravity.CENTER else (Gravity.CENTER_VERTICAL or Gravity.START)")
                      changed = True
                  else:
                      out.append(line)
              return out if changed else lines

          edit("app/src/main/java/com/lite/launcher/ControlCenter.kt", control)
          edit("app/src/main/java/com/lite/launcher/IslandService.kt", island)
          edit("app/src/main/java/com/lite/launcher/MainActivity.kt", main)
          PY

      - name: Build release APK
        working-directory: LiteLauncher
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package fixed source
        run: |
          cd LiteLauncher
          zip -qr ../LiteLauncher-fixed.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LiteLauncher/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-fixed-source
          path: LiteLauncher-fixed.zip
