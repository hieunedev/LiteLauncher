name: NovaOS Android CI

on:
  push:
    branches: [novaos-foundation]
    paths: ['NovaOS/**', '.github/workflows/novaos-android.yml']
  pull_request:
    paths: ['NovaOS/**', '.github/workflows/novaos-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NovaOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-debug
          path: NovaOS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
