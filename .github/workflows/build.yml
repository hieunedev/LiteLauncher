name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore full source tree from archive
        run: |
          unzip -q LiteLauncher.zip
          cp -a LiteLauncher/. .
          rm -rf LiteLauncher

      - name: Normalize Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, transform):
              p = Path(path)
              lines = p.read_text().splitlines()
              out = transform(lines)
              if out == lines:
                  raise SystemExit(f"{path}: expected source pattern was not found")
              p.write_text("\n".join(out) + "\n")

          def control(lines):
              out = []
              changed = False
              for line in lines:
                  if "val id = cam ?: cm.cameraIdList.firstOrNull" in line:
                      out.extend([
                          "        val id = cam ?: cm.cameraIdList.firstOrNull { cameraId ->",
                          "            cm.getCameraCharacteristics(cameraId).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true",
                          "        } ?: return",
                          "        cam = id",
                          "        torchOn = !torchOn",
                          "        cm.setTorchMode(id, torchOn)"
                      ])
                      changed = True
                  elif "torchOn = !torchOn; cm.setTorchMode(id, torchOn)" in line:
                      changed = True
                  else:
                      out.append(line)
              return out if changed else lines

          def island(lines):
              out = []
              changed = False
              for line in lines:
                  if "if (n.category !in live" in line:
                      out.extend([
                          "            val category = n.category",
                          "            if (category == null || category !in live || (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return@post"
                      ])
                      changed = True
                  else:
                      out.append(line)
              return out if changed else lines

          def main(lines):
              out = []
              changed = False
              for line in lines:
                  if "private fun pageAdapter(count:" in line and ": RecyclerView.Adapter<RecyclerView.ViewHolder>" not in line:
                      out.append("    private fun pageAdapter(count: () -> Int, bind: (Int) -> View): RecyclerView.Adapter<RecyclerView.ViewHolder> = object : RecyclerView.Adapter<RecyclerView.ViewHolder>() {")
                      changed = True
                  elif "SYSTEM_UI_FLAG_LAYOUT_FULL_SCREEN" in line:
                      out.append(line.replace("SYSTEM_UI_FLAG_LAYOUT_FULL_SCREEN", "SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN"))
                      changed = True
                  elif "gravity = if (st.clockCenter) Gravity.CENTER else Gravity.CENTER_VERTICAL or Gravity.START" in line:
                      out.append("        gravity = if (st.clockCenter) Gravity.CENTER else (Gravity.CENTER_VERTICAL or Gravity.START)")
                      changed = True
                  else:
                      out.append(line)
              return out if changed else lines

          edit("app/src/main/java/com/lite/launcher/ControlCenter.kt", control)
          edit("app/src/main/java/com/lite/launcher/IslandService.kt", island)
          edit("app/src/main/java/com/lite/launcher/MainActivity.kt", main)
          PY

      - name: Commit normalized source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already normalized"
          else
            git commit -m "Replace archive project with normalized source tree"
            git push
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package source
        run: |
          zip -qr LiteLauncher-source.zip             app build.gradle.kts settings.gradle.kts gradle.properties             AndroidManifest.xml 2>/dev/null || true
          if [ -d app ]; then
            zip -qr LiteLauncher-source.zip app build.gradle.kts settings.gradle.kts gradle.properties
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-source
          path: LiteLauncher-source.zip
