name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract project
        run: unzip -q LiteLauncher.zip

      - name: Apply Kotlin compatibility fixes
        working-directory: LiteLauncher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path, pattern, replacement):
              p = Path(path)
              s = p.read_text()
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.MULTILINE)
              if n == 0:
                  raise SystemExit(f"{path}: expected source pattern was not found")
              p.write_text(s2)

          patch(
              "app/src/main/java/com/lite/launcher/ControlCenter.kt",
              r"        val id = cam \\?: cm\\.cameraIdList\\.firstOrNull \\{ cm\\.getCameraCharacteristics\\(it\\)\\.get\\(CameraCharacteristics\\.FLASH_INFO_AVAILABLE\\) == true \\}\\.also \\{ cam = it \} \\?: return\\n        torchOn = !torchOn; cm\\.setTorchMode\\(id, torchOn\\)",
              """        val id = cam ?: cm.cameraIdList.firstOrNull { cameraId ->
            cm.getCameraCharacteristics(cameraId).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
        } ?: return
        cam = id
        torchOn = !torchOn
        cm.setTorchMode(id, torchOn)"""
          )

          patch(
              "app/src/main/java/com/lite/launcher/IslandService.kt",
              r"            if \\(n\\.category !in live \\|\\| \\(n\\.flags and Notification\\.FLAG_GROUP_SUMMARY\\) != 0\\) return@post",
              """            val category = n.category
            if (category == null || category !in live || (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return@post"""
          )

          patch(
              "app/src/main/java/com/lite/launcher/MainActivity.kt",
              r"    private fun pageAdapter\\(count: \\(\\) -> Int, bind: \\(Int\\) -> View\\) = object : RecyclerView\\.Adapter<RecyclerView\\.ViewHolder>\\(\\) \\{",
              "    private fun pageAdapter(count: () -> Int, bind: (Int) -> View): RecyclerView.Adapter<RecyclerView.ViewHolder> = object : RecyclerView.Adapter<RecyclerView.ViewHolder>() {"
          )

          patch(
              "app/src/main/java/com/lite/launcher/MainActivity.kt",
              r"        gravity = if \\(st\\.clockCenter\\) Gravity\\.CENTER else Gravity\\.CENTER_VERTICAL or Gravity\\.START",
              "        gravity = if (st.clockCenter) Gravity.CENTER else (Gravity.CENTER_VERTICAL or Gravity.START)"
          )
          PY

      - name: Build release APK
        working-directory: LiteLauncher
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package fixed source
        run: |
          cd LiteLauncher
          zip -qr ../LiteLauncher-fixed.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LiteLauncher/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-fixed-source
          path: LiteLauncher-fixed.zip
